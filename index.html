<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Hub Of Olimpus o Melhor Site Porno Sem Anuncios Do Mundo">
    <meta name="keywords" content="vídeos,streaming,mobile player,trans,femboys,femboy,tits,boobs">
    <title>Hub of Olimpus - V27</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');
        :root { --primary: #ff9000; --bg: #000; --surface: #0a0a0a; --border: #1a1a1a; --text-main: #ffffff; --text-muted: #666; }
        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }
        body { background: var(--bg); color: var(--text-main); font-family: 'Montserrat', sans-serif; overflow-x: hidden; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

        header {
            height: 70px; background: #000; display: flex; align-items: center; 
            padding: 0 4%; border-bottom: 2px solid var(--primary);
            position: fixed; top: 0; width: 100%; z-index: 2000;
        }
        .logo { font-size: 28px; font-weight: 900; letter-spacing: -2px; text-decoration: none; color: #fff; }
        .logo span { color: var(--primary); }
        .search-box { flex: 1; max-width: 500px; margin: 0 40px; }
        .search-box input { 
            width: 100%; background: #0a0a0a; border: 1px solid var(--border); 
            padding: 12px 20px; border-radius: 4px; color: #fff; font-family: inherit;
        }

        .sub-header { 
            margin-top: 70px; background: #050505; border-bottom: 1px solid var(--border); 
            padding: 15px 4%; display: flex; gap: 25px; overflow-x: auto; scrollbar-width: none; 
        }
        .nav-item { flex-shrink: 0; cursor: pointer; color: var(--text-muted); font-size: 11px; font-weight: 900; text-transform: uppercase; }
        .nav-item.active { color: var(--primary); }

        main { padding: 20px 4%; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .v-card { cursor: pointer; transition: 0.3s; }
        .v-card:hover { transform: translateY(-5px); }
        .v-thumb { aspect-ratio: 16/9; background: var(--surface); border-radius: 4px; overflow: hidden; position: relative; border: 1px solid var(--border); }
        .v-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .v-duration { position: absolute; bottom: 8px; right: 8px; background: var(--primary); color: #000; font-weight: 900; font-size: 10px; padding: 2px 6px; border-radius: 2px; }
        .v-title { font-size: 12px; font-weight: 700; padding: 10px 5px; text-transform: uppercase; color: #eee; line-height: 1.3; }

        #loader { text-align: center; padding: 30px; color: var(--primary); font-weight: 900; display: none; }

        /* THEATER MODE */
        #theater { display: none; position: fixed; inset: 0; background: #000; z-index: 9999; grid-template-columns: 1fr 350px; }
        .player-main { display: flex; flex-direction: column; overflow: hidden; }
        .player-header { height: 60px; background: #050505; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid var(--border); }
        .btn-back { background: var(--primary); color: #000; border: none; padding: 8px 20px; font-weight: 900; border-radius: 2px; cursor: pointer; font-size: 11px; }
        
        .video-container { flex: 1; background: #000; display: flex; align-items: center; justify-content: center; }
        iframe { width: 100%; height: 100%; border: none; }
        
        .player-info { padding: 20px; background: #050505; border-top: 1px solid var(--border); }
        .v-playing-title { font-size: 16px; font-weight: 700; color: #fff; text-transform: uppercase; margin: 0; }

        .side-panel { background: #080808; border-left: 1px solid var(--border); padding: 15px; overflow-y: auto; }
        .side-head { color: var(--primary); font-weight: 900; font-size: 12px; margin-bottom: 15px; text-transform: uppercase; border-left: 3px solid var(--primary); padding-left: 8px; }
        
        .side-item { display: flex; gap: 10px; margin-bottom: 15px; cursor: pointer; transition: 0.2s; }
        .side-item:hover { opacity: 0.7; }
        .side-thumb { width: 120px; aspect-ratio: 16/9; flex-shrink: 0; border-radius: 2px; overflow: hidden; background: #111; }
        .side-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .side-title { font-size: 10px; font-weight: 700; color: #ccc; text-transform: uppercase; line-height: 1.2; }

        @media (max-width: 1100px) { #theater { grid-template-columns: 1fr; } .side-panel { display: none; } }
    </style>
</head>
<body>

<header>
    <a href="#" class="logo" onclick="location.reload()">HUB OF <span>OLIMPUS</span></a>
    <div class="search-box">
        <input type="text" id="q" data-i18n="search_placeholder" onkeypress="if(event.key=='Enter')runSearch()">
    </div>
</header>

<div class="sub-header">
    <div class="nav-item active" onclick="setChan('', this)" data-i18n="cat_global">GLOBAL</div>
    <div class="nav-item" onclick="setChan('Trans', this)">TRANS</div>
    <div class="nav-item" onclick="setChan('Femboys', this)">FEMBOY</div>
    <div class="nav-item" onclick="setChan('Compilation', this)" data-i18n="cat_comp">COMPILATIONS</div>
</div>

<main>
    <div class="grid" id="main-grid"></div>
    <div id="loader" data-i18n="loading">...</div>
</main>

<div id="theater">
    <div class="player-main">
        <div class="player-header">
            <div data-i18n="streaming_now" style="font-size: 10px; font-weight: 900; color: var(--primary);">STREAMING...</div>
            <button class="btn-back" onclick="closePlayer()" data-i18n="btn_back">VOLTAR</button>
        </div>
        <div class="video-container" id="p-container"></div>
        <div class="player-info">
            <h2 id="v-title-display" class="v-playing-title"></h2>
        </div>
    </div>
    <div class="side-panel">
        <div class="side-head" data-i18n="related">RELACIONADOS</div>
        <div id="rel-grid"></div>
    </div>
</div>

<script>
    const translations = {
        'pt': { search_placeholder: "BUSCAR...", cat_global: "GLOBAL", cat_comp: "COMPILAÇÕES", loading: "CARREGANDO...", streaming_now: "STREAMING EM CURSO", btn_back: "VOLTAR", related: "RELACIONADOS" },
        'en': { search_placeholder: "SEARCH...", cat_global: "GLOBAL", cat_comp: "COMPILATIONS", loading: "LOADING...", streaming_now: "STREAMING IN PROGRESS", btn_back: "BACK", related: "RELATED" },
        'ru': { search_placeholder: "ПОИСК...", cat_global: "ГЛОБАЛЬНЫЙ", cat_comp: "ПОДБОРКИ", loading: "ЗАГРУЗКА...", streaming_now: "ТРАНСЛЯЦИЯ", btn_back: "НАЗАД", related: "ПОХОЖИЕ" }
    };

    let currentChan = '', allVideos = [], currentPage = 1, isLoading = false;

    function applyTranslation() {
        const userLang = navigator.language.split('-')[0];
        const lang = translations[userLang] ? userLang : 'en';
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (el.tagName === 'INPUT') el.placeholder = translations[lang][key];
            else el.innerText = translations[lang][key];
        });
    }

    async function executeFetch(page) {
        if (isLoading) return;
        isLoading = true;
        document.getElementById('loader').style.display = 'block';
        const query = document.getElementById('q').value || "popular";
        const url = `https://www.eporner.com/api/v2/video/search/?query=${encodeURIComponent(currentChan || query)}&per_page=40&page=${page}&thumbsize=big&format=json`;
        
        try {
            const res = await fetch(url);
            const data = await res.json();
            if (data.videos) {
                allVideos = page === 1 ? data.videos : [...allVideos, ...data.videos];
                renderGrid(data.videos, page === 1);
            }
        } catch (e) { console.error(e); }
        finally { isLoading = false; document.getElementById('loader').style.display = 'none'; }
    }

    function renderGrid(videos, clear) {
        const grid = document.getElementById('main-grid');
        if (clear) grid.innerHTML = "";
        videos.forEach(v => {
            const div = document.createElement('div');
            div.className = 'v-card';
            div.onclick = () => openPlayer(v);
            div.innerHTML = `<div class="v-thumb"><div class="v-duration">${v.length_min}M</div><img src="${v.default_thumb.src}" loading="lazy"></div><div class="v-title">${v.title}</div>`;
            grid.appendChild(div);
        });
    }

    window.onscroll = () => { if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 1000) { if (!isLoading) { currentPage++; executeFetch(currentPage); } } };

    function runSearch() { currentPage = 1; executeFetch(1); window.scrollTo(0,0); }
    function setChan(c, b) { currentChan = c; document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active')); b.classList.add('active'); runSearch(); }
    
    function openPlayer(v) {
        // 1. Exibe o player
        document.getElementById('theater').style.display = 'grid';
        document.body.style.overflow = 'hidden';
        
        // 2. Ajusta o título (Fonte menor)
        document.getElementById('v-title-display').innerText = v.title;
        document.getElementById('v-title-display').style.fontSize = "14px";
        
        // 3. Carrega o vídeo
        const embedUrl = v.embed.includes('?') ? `${v.embed}&hd=1` : `${v.embed}?hd=1`;
        document.getElementById('p-container').innerHTML = `<iframe src="${embedUrl}" allowfullscreen allow="autoplay"></iframe>`;
        
        // 4. GERA OS RELACIONADOS NA LATERAL
        const relGrid = document.getElementById('rel-grid');
        relGrid.innerHTML = ""; // Limpa antes de carregar
        
        // Pega os vídeos que já foram carregados no site e escolhe alguns aleatórios
        if (allVideos.length > 0) {
            // Embaralha e pega 15 vídeos
            const relatedData = [...allVideos].sort(() => 0.5 - Math.random()).slice(0, 15);
            
            relatedData.forEach(rv => {
                const item = document.createElement('div');
                item.className = 'side-item';
                item.onclick = () => {
                    // Função para trocar o vídeo sem fechar o player
                    openPlayer(rv);
                };
                item.innerHTML = `
                    <div class="side-thumb">
                        <img src="${rv.default_thumb.src}" alt="thumb">
                    </div>
                    <div class="side-title">${rv.title.substring(0, 45)}...</div>
                `;
                relGrid.appendChild(item);
            });
        }
    }

    function closePlayer() { document.getElementById('theater').style.display = 'none'; document.body.style.overflow = 'auto'; document.getElementById('p-container').innerHTML = ""; }

    applyTranslation();
    executeFetch(1);
</script>
</body>
</html>
